name: CI

on:
  push:
  pull_request:

jobs:
  nim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
      # Semantic compile check only. A full `nim cpp` link would need the
      # platform webview libraries (WebKit/Cocoa or webkit2gtk); `nim check`
      # catches Nim-level errors without them.
      - name: Nim compile check
        run: nim check --hints:off src/note.nim
      # storage tests don't touch webview, so they compile and run headless.
      - name: Nim unit tests
        run: nimble -y test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm test
      # Non-blocking for now: there are pre-existing type errors (see
      # REFACTORING.md §6 / §5). Make this blocking once they are resolved.
      - name: svelte-check
        run: npm run check
        continue-on-error: true
